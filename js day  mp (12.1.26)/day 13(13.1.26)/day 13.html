    <h1>task 1</h1>

      <h1> Product Catalog</h1>

  <!-- Filter & Sort Controls -->
  <div class="controls">
    <label>Filter below $500:
      <input type="checkbox" id="filterPrice">
    </label>
    <button id="sortPrice">Sort by Price (Low → High)</button>
  </div>

  <!-- Product List -->
  <div id="productList"></div>

  <!-- Product Details -->
  <div id="productDetails" class="hidden"></div>

  <script>
//  comments for classroom clarity

let products = [];
let filteredProducts = [];

// 🟢 Step 1: Fetch product data from JSON
fetch('product.json')
  .then(res => res.json())
  .then(data => {
    products = data;
    filteredProducts = [...products];
    displayProducts(filteredProducts);
  });

// 🟢 Step 2: Display products
function displayProducts(list) {
  const container = document.getElementById('productList');
  container.innerHTML = '';
  list.forEach(p => {
    const div = document.createElement('div');
    div.className = 'product';
    div.innerHTML = `<strong>${p.name}</strong><br>Price: $${p.price}<br>Category: ${p.category}`;
    div.onclick = () => showDetails(p); // Step 4: Click → details
    container.appendChild(div);
  });
}

// 🟢 Step 3: Filter below $500
document.getElementById('filterPrice').addEventListener('change', (e) => {
  if (e.target.checked) {
    filteredProducts = products.filter(p => p.price < 500);
  } else {
    filteredProducts = [...products];
  }
  displayProducts(filteredProducts);
});

// 🟢 Step 3: Sort by price (Low → High)
document.getElementById('sortPrice').addEventListener('click', () => {
  filteredProducts.sort((a, b) => a.price - b.price);
  displayProducts(filteredProducts);
});

// 🟢 Step 4: Show product details
function showDetails(product) {
  const details = document.getElementById('productDetails');
  details.classList.remove('hidden');
  details.innerHTML = `
    <h2>${product.name}</h2>
    <p>Price: $${product.price}</p>
    <p>Category: ${product.category}</p>
    <p>Product ID: ${product.id}</p>
  `;
}

  </script>

 <h1> Movie Search App</h1>

  <!-- Search Box -->
  <input type="text" id="movieInput" placeholder="Enter movie title">
  <button id="searchBtn">Search</button>

  <!-- Movie Result -->
  <div id="movieResult"></div>

  <script>
//  comments for clarity

const searchBtn = document.getElementById('searchBtn');
const movieInput = document.getElementById('movieInput');
const movieResult = document.getElementById('movieResult');

// 🟢 Step 1: Fetch movie details using async/await
async function fetchMovie(title) {
  try {
    const res = await fetch(`https://www.omdbapi.com/?t=${title}&apikey=YOUR_API_KEY`);
    const data = await res.json();

    if (data.Response === "True") {
      displayMovie(data);
    } else {
      movieResult.innerHTML = `<p>❌ Movie not found!</p>`;
    }
  } catch (error) {
    movieResult.innerHTML = `<p>Error fetching movie details.</p>`;
  }
}

// 🟢 Step 2: Display movie info dynamically
function displayMovie(movie) {
  movieResult.innerHTML = `
    <h2>${movie.Title} (${movie.Year})</h2>
    <p><strong>Plot:</strong> ${movie.Plot}</p>
    <img src="${movie.Poster}" alt="Poster">
  `;
}

// 🟢 Step 3: Event listener for search button
searchBtn.addEventListener('click', () => {
  const title = movieInput.value.trim();
  if (title) {
    fetchMovie(title);
  } else {
    movieResult.innerHTML = `<p>Please enter a movie title.</p>`;
  }
});

  </script>

  <h1>task 3</h1>

  <div class="weather-app">
    <div class="wa-card" id="wa-card">
      <div class="wa-header">
        <div class="wa-title">Weather • Simple App</div>
        <div style="font-size:12px;color:#94a3b8">Powered by Open‑Meteo</div>
      </div>

      <form class="wa-form" id="wa-form">
        <input
          class="wa-input"
          id="wa-input"
          type="text"
          placeholder="Enter city (e.g., Kovilpatti)"
          aria-label="City name"
          required
        />
        <button class="wa-btn" type="submit">Get Weather</button>
      </form>

      <div class="wa-status" id="wa-status"></div>
  <div class="wa-result" id="wa-result" style="display:none">
        <div>
          <div class="wa-city" id="wa-city">—</div>
          <div class="wa-main">
            <div class="wa-icon" id="wa-icon">☀️</div>
            <div class="wa-temp" id="wa-temp">—°C</div>
          </div>
          <div class="wa-details">
            <div><span class="wa-label">Condition:</span> <span id="wa-cond">—</span></div>
            <div><span class="wa-label">Wind:</span> <span id="wa-wind">— km/h</span></div>
          </div>
        </div>
        <div style="text-align:right;font-size:12px;color:#94a3b8">
          <div id="wa-time">—</div>
          <div id="wa-tz">—</div>
        </div>
      </div>
    </div>
  </div>

<script>


        const form = document.getElementById('wa-form');
    const input = document.getElementById('wa-input');
    const statusEl = document.getElementById('wa-status');
    const resultEl = document.getElementById('wa-result');
    const cityEl = document.getElementById('wa-city');
    const iconEl = document.getElementById('wa-icon');
    const tempEl = document.getElementById('wa-temp');
    const condEl = document.getElementById('wa-cond');
    const windEl = document.getElementById('wa-wind');
    const timeEl = document.getElementById('wa-time');
    const tzEl = document.getElementById('wa-tz');

    // Simple mapping from weather codes to text + emoji icon
    const codeMap = {
      0: {txt: 'Clear sky', icon: '☀️'},
      1: {txt: 'Mainly clear', icon: '🌤️'},
      2: {txt: 'Partly cloudy', icon: '⛅'},
      3: {txt: 'Overcast', icon: '☁️'},
      45: {txt: 'Fog', icon: '🌫️'},
      48: {txt: 'Depositing rime fog', icon: '🌫️'},
      51: {txt: 'Light drizzle', icon: '🌦️'},
      53: {txt: 'Moderate drizzle', icon: '🌦️'},
 55: {txt: 'Dense drizzle', icon: '🌧️'},
      61: {txt: 'Slight rain', icon: '🌦️'},
      63: {txt: 'Moderate rain', icon: '🌧️'},
      65: {txt: 'Heavy rain', icon: '🌧️'},
      66: {txt: 'Freezing rain (light)', icon: '🌧️'},
      67: {txt: 'Freezing rain (heavy)', icon: '🌧️'},
      71: {txt: 'Slight snow', icon: '🌨️'},
      73: {txt: 'Moderate snow', icon: '❄️'},
      75: {txt: 'Heavy snow', icon: '❄️'},
      77: {txt: 'Snow grains', icon: '❄️'},
      80: {txt: 'Rain showers (slight)', icon: '🌦️'},
      81: {txt: 'Rain showers (moderate)', icon: '🌧️'},
      82: {txt: 'Rain showers (violent)', icon: '⛈️'},
      85: {txt: 'Snow showers (slight)', icon: '🌨️'},
      86: {txt: 'Snow showers (heavy)', icon: '❄️'},
      95: {txt: 'Thunderstorm', icon: '⛈️'},
      96: {txt: 'Thunderstorm (hail)', icon: '⛈️'},
      99: {txt: 'Thunderstorm (heavy hail)', icon: '⛈️'}
    };

 form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      showStatus('Searching city… / நகரத்தை தேடுகிறது…');
      hideResult();

      try {
        // 1) Geocode the city
        const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1`;
        const geoRes = await fetch(geoUrl);
        if (!geoRes.ok) throw new Error('Geocoding failed');
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          showStatus('City not found. Try a different name. / நகரம் கிடைக்கவில்லை. வேறு பெயரை முயற்சிக்கவும்.');
          return;
        }

        const place = geoData.results[0];
        const { latitude, longitude, name, country, timezone } = place;

  // 2) Fetch current weather
        const weatherUrl =
          `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code,wind_speed_10m&timezone=${encodeURIComponent(timezone)}`;
        showStatus('Fetching weather… / வானிலை பெறுகிறது…');
        const wRes = await fetch(weatherUrl);
        if (!wRes.ok) throw new Error('Weather fetch failed');
        const wData = await wRes.json();

        const current = wData.current;
        const codeInfo = codeMap[current.weather_code] || { txt: 'Unknown', icon: '🌡️' };

        // 3) Update UI
        cityEl.textContent = `${name}${country ? ', ' + country : ''}`;
        tempEl.textContent = `${Math.round(current.temperature_2m)}°C`;
        condEl.textContent = codeInfo.txt;
        windEl.textContent = `${Math.round(current.wind_speed_10m)} km/h`;
        iconEl.textContent = codeInfo.icon;

        timeEl.textContent = `Time: ${current.time}`;
        tzEl.textContent = `Time zone: ${wData.timezone}`;

        showResult();
        clearStatus();
      } catch (err) {
        console.error(err);
        showStatus('Something went wrong. Please try again. / ஏதோ தவறு ஏற்பட்டது. மீண்டும் முயற்சிக்கவும்.');
      }
    });
    function showStatus(msg) { statusEl.textContent = msg; }
    function clearStatus() { statusEl.textContent = ''; }
    function showResult() { resultEl.style.display = 'grid'; }
    function hideResult() { resultEl.style.display = 'none'; }

</script>

<h1>task 4</h1>
 <h1>Employee Management System</h1>

  <!-- Employee List -->
  <ul id="employeeList"></ul>

  <!-- Add Employee Form -->
  <h2>Add Employee</h2>
  <form id="employeeForm">
    <input type="text" id="name" placeholder="Enter name" required>
    <input type="text" id="role" placeholder="Enter role" required>
    <button type="submit">Add Employee</button>
  </form>

  <script>
// Step 1: Fetch employees.json and display list
async function loadEmployees() {
  const response = await fetch('employees.json'); // JSON file fetch செய்கிறோம்
  const employees = await response.json();

  const list = document.getElementById('employeeList');
  list.innerHTML = '';

  employees.forEach(emp => {
    const li = document.createElement('li');
    li.textContent = `${emp.name} - ${emp.role}`;

    // Delete button
    const delBtn = document.createElement('button');
    delBtn.textContent = 'Delete';
    delBtn.onclick = () => deleteEmployee(emp.id);

    li.appendChild(delBtn);
    list.appendChild(li);
  });
}

// Step 2: Add new employee
document.getElementById('employeeForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = document.getElementById('name').value;
  const role = document.getElementById('role').value;

  // Normally, we’d send POST request to backend// 
  let employees = JSON.parse(localStorage.getItem('employees')) || [];
  const newEmp = { id: Date.now(), name, role };
  employees.push(newEmp);
  localStorage.setItem('employees', JSON.stringify(employees));

  loadEmployees();
});

// Step 3: Delete employee
function deleteEmployee(id) {
  let employees = JSON.parse(localStorage.getItem('employees')) || [];
  employees = employees.filter(emp => emp.id !== id);
  localStorage.setItem('employees', JSON.stringify(employees));
  loadEmployees();
}

// Initial load
loadEmployees();
  </script>

 <h1> Crypto Tracker</h1>
  <div id="crypto-container" class="crypto-container"></div>

  <script>
    const container = document.getElementById("crypto-container");

    async function fetchCrypto() {
      try {
        const res = await fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=10&page=1&sparkline=false");
        const data = await res.json();

        container.innerHTML = ""; // clear old data

        data.forEach(coin => {
          const card = document.createElement("div");
          card.className = "card";
 card.innerHTML = `
            <h2>${coin.name} <span class="symbol">(${coin.symbol.toUpperCase()})</span></h2>
            <p class="price">Price: $${coin.current_price}</p>
            <p class="change ${coin.price_change_percentage_24h >= 0 ? 'green' : 'red'}">
              24h: ${coin.price_change_percentage_24h.toFixed(2)}%
            </p>
          `;

          container.appendChild(card);
        });
      } catch (error) {
        container.innerHTML = "<p>Error fetching data</p>";
      }
    }

    // Initial fetch
    fetchCrypto();

    // Auto-refresh every 60 seconds
    setInterval(fetchCrypto, 60000);
  </script>

  <h1>task 6</h1>

 <h1> Country Explorer</h1>

  <!-- 🔍 Search bar -->
  <input type="text" id="searchBar" placeholder="Search country by name...">

  <!-- ⬇️ Dropdown -->
  <select id="countryDropdown"></select>

  <!-- 📊 Country Info -->
  <div id="countryInfo"></div>

  <script>
    let countriesData = [];

    // 1️⃣ Fetch country data
    async function fetchCountries() {
      const response = await fetch("https://restcountries.com/v3.1/all");
      countriesData = await response.json();
      populateDropdown(countriesData);
    }
  // 2️⃣ Populate dropdown
    function populateDropdown(data) {
      const dropdown = document.getElementById("countryDropdown");
      dropdown.innerHTML = "";
      data.sort((a,b) => a.name.common.localeCompare(b.name.common));
      data.forEach(country => {
        const option = document.createElement("option");
        option.value = country.name.common;
        option.textContent = country.name.common;
        dropdown.appendChild(option);
      });
      showCountryInfo(data[0]); // Show first country by default
    }

    // 3️⃣ Display country info
    function showCountryInfo(country) {
      const infoDiv = document.getElementById("countryInfo");
      infoDiv.innerHTML = `
        <img src="${country.flags.png}" alt="Flag of ${country.name.common}">
        <p><span class="label">Name:</span> ${country.name.common}</p>
        <p><span class="label">Capital:</span> ${country.capital ? country.capital[0] : "N/A"}</p>
        <p><span class="label">Region:</span> ${country.region}</p>
        <p><span class="label">Population:</span> ${country.population.toLocaleString()}</p>
      `;
    }

      // 4️⃣ Handle dropdown change
    document.getElementById("countryDropdown").addEventListener("change", e => {
      const selected = countriesData.find(c => c.name.common === e.target.value);
      showCountryInfo(selected);
    });

    // 5️⃣ Search filter
    document.getElementById("searchBar").addEventListener("input", e => {
      const searchValue = e.target.value.toLowerCase();
      const filtered = countriesData.filter(c =>
        c.name.common.toLowerCase().includes(searchValue)
      );
      populateDropdown(filtered);
    });

    // 🚀 Initialize
    fetchCountries();
  </script>
